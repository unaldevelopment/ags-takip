<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AGS Takip">
  <title>AGS &amp; ÖABT Kimya Takip</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2v6.5L4.5 18A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3L14 8.5V2h-4z"/>
            <path d="M8.5 2h7M7 16h10"/>
          </svg>
        </div>
        <span class="logo-text">AGS Takip</span>
      </div>
      <nav id="nav"></nav>
      <button class="nav-item settings-btn" data-a="settings"><span class="ni" id="ico-settings"></span><span>Ayarlar</span></button>
    </aside>
    <main id="main"></main>
  </div>

  <dialog id="settings">
    <h2 class="modal-title">Ayarlar</h2>
    <p class="modal-desc">ÖSYM 2027 sınav tarihlerini açıkladığında buraya girin.</p>
    <label class="field-label" for="d-ags">AGS tarihi</label>
    <input type="date" id="d-ags" class="input-dark-48">
    <label class="field-label" for="d-oabt">ÖABT tarihi</label>
    <input type="date" id="d-oabt" class="input-dark-48">
    <hr class="modal-divider">
    <h3 class="modal-subtitle">Yedekleme</h3>
    <p class="modal-desc">İlerleme bu tabletin tarayıcısında saklanır. Tarayıcı verisi silinirse kaybolur; arada yedek alın.</p>
    <div class="backup-btn-grid">
      <button class="btn-backup" data-a="export">Yedeği indir</button>
      <label class="btn-backup">Yedeği yükle
        <input type="file" id="import" accept="application/json,.json" hidden>
      </label>
    </div>
    <hr class="modal-divider">
    <div class="modal-footer">
      <button class="btn-reset-danger" data-a="reset">Tüm verileri sıfırla</button>
      <button class="btn-close-amber" data-a="closeSettings">Kapat</button>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="konular.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          console.log('ServiceWorker registered:', reg.scope);
        }).catch((err) => {
          console.warn('ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
